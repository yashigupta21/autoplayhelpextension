<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      width: 240px;
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 15px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1f1f1f;
      border-radius: 10px;
      padding: 13px 14px;
      margin-bottom: 10px;
    }

    .status-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #ccc;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .dot.active { background: #46d369; }

    .footer { text-align: center; }

    .settings-btn {
      font-size: 11px;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .settings-btn:hover { color: #999; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">N</div>
    <h1>Netflix AutoSkip</h1>
  </div>

  <div class="toggle-row">
    <div class="status-label">
      <span class="dot" id="dot"></span>
      <span id="status">Loading…</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    <button class="settings-btn" id="settings-btn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
